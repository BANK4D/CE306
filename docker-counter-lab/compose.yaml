
services:
  web:
    image: ce-counter:lab
    build: .
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      REDIS_HOST: redis
      APP_LABEL: "Group A"
      COUNTER_KEY: "visits:a"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  web-b:
    image: ce-counter:lab
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      REDIS_HOST: redis
      APP_LABEL: "Group B"
      COUNTER_KEY: "visits:b"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - counter-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 3s

volumes:
  counter-data:
